# Serviços locais para desenvolvimento (não usar em produção)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lojas
      POSTGRES_PASSWORD: lojas_dev
      POSTGRES_DB: lojas_tropical_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
