name: Atualizar estoque

on:
  schedule:
    - cron: "17 * * * *"   # pedido a cada hora (o GitHub costuma atrasar ou pular execuções agendadas)
  workflow_dispatch:          # botao "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: estoque
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar estoque e precos no Solidus
        env:
          SOLIDUS_TOKEN: ${{ secrets.SOLIDUS_TOKEN }}
          # Um token por loja: o site mostra a soma das 8 lojas
          SOLIDUS_TOKEN_MATRIZ: ${{ secrets.SOLIDUS_TOKEN_MATRIZ }}
          SOLIDUS_TOKEN_AVENIDA: ${{ secrets.SOLIDUS_TOKEN_AVENIDA }}
          SOLIDUS_TOKEN_TIMBIRAS: ${{ secrets.SOLIDUS_TOKEN_TIMBIRAS }}
          SOLIDUS_TOKEN_PIO_XII: ${{ secrets.SOLIDUS_TOKEN_PIO_XII }}
          SOLIDUS_TOKEN_DOM_PEDRO: ${{ secrets.SOLIDUS_TOKEN_DOM_PEDRO }}
          SOLIDUS_TOKEN_GONCALVES_DIAS: ${{ secrets.SOLIDUS_TOKEN_GONCALVES_DIAS }}
          SOLIDUS_TOKEN_COROATA: ${{ secrets.SOLIDUS_TOKEN_COROATA }}
          SOLIDUS_TOKEN_ALTO_ALEGRE: ${{ secrets.SOLIDUS_TOKEN_ALTO_ALEGRE }}
        run: python scripts/atualizar_estoque.py
      - name: Salvar se mudou
        run: |
          git diff --quiet estoque.js && { echo "Sem mudancas"; exit 0; }
          git config user.name "atualizacao-estoque"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estoque.js
          git commit -m "Atualiza estoque"
          git push
